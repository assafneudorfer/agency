# Published apps on AWS Fargate: the platform pushes each app's image to ECR and runs it as an ECS
# service; Traefik routes to the tasks from the file the platform writes. infra/aws adds this file
# through COMPOSE_FILE in .env.
#
# No stored keys: the host assumes the apps role and refreshes its short-lived credentials under
# /var/lib/agency/aws/apps (infra/aws/host/agency-aws-credentials).
services:
  postgres:
    # The apps' live databases, reachable from the apps' security group only (infra/aws/apps.tf).
    ports:
      - "5432:5432"
  platform:
    environment:
      AGENCY_APP_RUNTIME: fargate
      AGENCY_AWS_REGION: ${AGENCY_AWS_REGION:-us-east-1}
      AGENCY_APPS_CREDENTIALS_FILE: /aws-apps/credentials.json
      AGENCY_ECS_CLUSTER: ${AGENCY_ECS_CLUSTER:?set AGENCY_ECS_CLUSTER in .env}
      AGENCY_ECR_REPOSITORY: ${AGENCY_ECR_REPOSITORY:?set AGENCY_ECR_REPOSITORY in .env}
      AGENCY_ECS_SUBNETS: ${AGENCY_ECS_SUBNETS:?set AGENCY_ECS_SUBNETS in .env}
      AGENCY_ECS_SECURITY_GROUP: ${AGENCY_ECS_SECURITY_GROUP:?set AGENCY_ECS_SECURITY_GROUP in .env}
      AGENCY_ECS_EXECUTION_ROLE_ARN: ${AGENCY_ECS_EXECUTION_ROLE_ARN:?set AGENCY_ECS_EXECUTION_ROLE_ARN in .env}
      AGENCY_ECS_LOG_GROUP: ${AGENCY_ECS_LOG_GROUP:?set AGENCY_ECS_LOG_GROUP in .env}
      AGENCY_APP_MAX_TASKS: ${AGENCY_APP_MAX_TASKS:-3}
      AGENCY_HOST_PRIVATE_IP: ${AGENCY_HOST_PRIVATE_IP:?set AGENCY_HOST_PRIVATE_IP in .env (infra/aws/host/setup.sh)}
    volumes:
      - /var/lib/agency/aws/apps:/aws-apps:ro
