# Agency: self-hosted AI app builder on top of pi.
# Production: TLS with a Let's Encrypt wildcard certificate via Cloudflare DNS, or via Route 53 when
# .env adds docker-compose.route53.yml through COMPOSE_FILE (the all-AWS setup).
# Local: docker compose -f docker-compose.yml -f docker-compose.local.yml up
name: agency

services:
  traefik:
    image: traefik:v3.6.2
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=agency
      # Routes the platform writes for published apps and sandboxes on AWS Fargate.
      - --providers.file.directory=/dynamic
      - --providers.file.watch=true
      - --entrypoints.http.address=:80
      - --entrypoints.http.http.redirections.entrypoint.to=app
      - --entrypoints.http.http.redirections.entrypoint.scheme=https
      - --entrypoints.app.address=:443
      - --entrypoints.app.http.tls.certresolver=cf
      - --entrypoints.app.http.tls.domains[0].main=${AGENCY_BASE_DOMAIN}
      - --entrypoints.app.http.tls.domains[0].sans=*.${AGENCY_BASE_DOMAIN}
      - --certificatesresolvers.cf.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.cf.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.cf.acme.dnschallenge.provider=${AGENCY_DNS_PROVIDER:-cloudflare}
    environment:
      CF_DNS_API_TOKEN: ${CLOUDFLARE_DNS_API_TOKEN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
      - traefik-dynamic:/dynamic:ro
    labels:
      # Previews and published apps use this middleware: only signed-in team members get through.
      # Declared on Traefik itself so it exists even while the platform restarts.
      traefik.enable: "true"
      traefik.http.middlewares.agency-auth.forwardauth.address: http://platform:8080/auth/verify
      traefik.http.middlewares.agency-auth.forwardauth.trustForwardHeader: "true"
      # Who is signed in, for the app: these replace any same-named headers the browser sent.
      traefik.http.middlewares.agency-auth.forwardauth.authResponseHeaders: X-Agency-User,X-Agency-User-Id,X-Agency-User-Name,X-Agency-User-Role,X-Agency-App-Role
    networks: [agency]
    restart: unless-stopped

  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: agency
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: agency
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agency"]
      interval: 5s
      retries: 20
    networks: [agency]
    restart: unless-stopped

  platform:
    build: ./platform
    image: agency-platform:latest
    environment:
      AGENCY_BASE_DOMAIN: ${AGENCY_BASE_DOMAIN:?set AGENCY_BASE_DOMAIN in .env}
      AGENCY_PUBLIC_SCHEME: ${AGENCY_PUBLIC_SCHEME:-https}
      AGENCY_SECRET_KEY: ${AGENCY_SECRET_KEY:?set AGENCY_SECRET_KEY in .env}
      AGENCY_ADMIN_EMAIL: ${AGENCY_ADMIN_EMAIL:-}
      AGENCY_ADMIN_PASSWORD: ${AGENCY_ADMIN_PASSWORD:-}
      AGENCY_MODEL: ${AGENCY_MODEL:-}
      AGENCY_DEFAULT_BUDGET_USD: ${AGENCY_DEFAULT_BUDGET_USD:-20}
      AGENCY_SANDBOX_MEMORY: ${AGENCY_SANDBOX_MEMORY:-3g}
      AGENCY_SANDBOX_CPUS: ${AGENCY_SANDBOX_CPUS:-2}
      AGENCY_PI_IDLE_MINUTES: ${AGENCY_PI_IDLE_MINUTES:-10}
      AGENCY_SANDBOX_IDLE_MINUTES: ${AGENCY_SANDBOX_IDLE_MINUTES:-30}
      AGENCY_APP_IDLE_DAYS: ${AGENCY_APP_IDLE_DAYS:-7}
      DATABASE_URL: postgres://agency:${POSTGRES_PASSWORD}@postgres:5432/agency
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - traefik-dynamic:/traefik-dynamic
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.http.routers.platform.rule: Host(`${AGENCY_BASE_DOMAIN}`)
      traefik.http.routers.platform.entrypoints: app
      traefik.http.routers.platform.service: platform
      traefik.http.services.platform.loadbalancer.server.port: "8080"
      # Fallback for app hosts with no route: previews whose sandbox is asleep, and published apps taken
      # down after days without visits. The platform starts them and reloads the page. Lowest priority,
      # so a running sandbox or app wins.
      traefik.http.routers.platform-wake.rule: HostRegexp(`^[a-z0-9-]+\.${AGENCY_BASE_DOMAIN}$$`)
      traefik.http.routers.platform-wake.priority: "1"
      traefik.http.routers.platform-wake.entrypoints: app
      traefik.http.routers.platform-wake.middlewares: agency-auth@docker
      traefik.http.routers.platform-wake.service: platform
    networks: [agency]
    restart: unless-stopped

  # Build-only service for the per-app sandbox image: docker compose --profile build build sandbox
  sandbox:
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    image: agency-sandbox:latest
    profiles: [build]

networks:
  agency:
    name: agency

volumes:
  pgdata:
  letsencrypt:
  traefik-dynamic:
